name: api-gateway
namespace: prod

replicaCount: 1

image:
  repository: khawlarouiss/ci-cd-gateway
  tag: latest

service:
  port: 80
  targetPort: 8090

env:
  SPRING_PROFILES_ACTIVE: prod

config:
  LOG_LEVEL: INFO

ingress:
  enabled: true
  host: api-prod.bookstore.com
  tlsSecret: bookstore-prod-tls

deployment:
  strategy: canary

canary:
  stepWeight: 10
  stepInterval: 2m
  maxWeight: 50
  failureThreshold: 3
  thresholds:
    successRate: 99.5
    latency: 300