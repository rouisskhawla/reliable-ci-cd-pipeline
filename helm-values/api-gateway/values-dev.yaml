name: api-gateway
namespace: dev

replicaCount: 1

image:
  repository: khawlarouiss/ci-cd-gateway
  tag: ""

service:
  port: 80
  targetPort: 8090

env:
  SPRING_PROFILES_ACTIVE: dev

config:
  LOG_LEVEL: INFO

ingress:
  refKind: Ingress
  refApiVersion: networking.k8s.io/v1
  name: api-gateway
  enabled: true
  host: api-dev.bookstore.com
  tlsSecret: bookstore-dev-tls
  
deployment:
  strategy: rolling

probes:
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    
resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

metrics:
  path: /actuator/prometheus