name: bookstore-frontend
namespace: prod

replicaCount: 1

image:
  repository: khawlarouiss/ci-cd-bookstore-frontend
  tag: latest

service:
  port: 80
  targetPort: 80

ingress:
  enabled: true
  host: prod.bookstore.com
  tlsSecret: bookstore-prod-tls

probes:
  readiness:
    path: /health

  liveness:
    path: /health

deployment:
  strategy: canary

canary:
  stepWeight: 10
  stepInterval: 2m
  maxWeight: 50
  failureThreshold: 3
  thresholds:
    successRate: 99.5
    latency: 300