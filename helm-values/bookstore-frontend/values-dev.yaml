name: bookstore-frontend
namespace: dev

replicaCount: 1

image:
  repository: khawlarouiss/ci-cd-bookstore-frontend
  tag: ""  
  
service:
  port: 80
  targetPort: 80

ingress:
  enabled: true
  host: dev.bookstore.com
  tlsSecret: bookstore-dev-tls
  refKind: Ingress
  refApiVersion: networking.k8s.io/v1
  name: {{ .Values.name }}

deployment:
  strategy: rolling

probes:
  readiness:
    path: /
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  liveness:
    path: /
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    
metrics:
  path: /metrics

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"