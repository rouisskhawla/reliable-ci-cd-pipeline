name: app
namespace: default

replicaCount: 1

image:
  repository: ""
  tag: ""
  pullPolicy: Always

service:
  port: 80
  targetPort: 8080

env: {}

config: {}

ingress:
  enabled: false
  className: nginx
  host: ""
  tlsSecret: ""

global:
  imageTag: "latest"

deployment:
  strategy: rolling

probes:
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

metrics:
  path: /actuator/prometheus

canary:
  stepWeight: 10
  stepInterval: 1m
  maxWeight: 50
  failureThreshold: 5
  thresholds:
    successRate: 99
    latency: 500