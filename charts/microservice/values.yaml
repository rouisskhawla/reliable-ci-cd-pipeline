name: app
namespace: default

replicaCount: 1

image:
  repository: ""
  tag: ""
  pullPolicy: Always

service:
  port: 80
  targetPort: 8080

env: {}

config: {}

ingress:
  enabled: false
  className: nginx
  host: ""
  tlsSecret: ""

probes:
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3