{{- if eq .Values.deployment.strategy "canary" }}
apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.name }}
  ingress:
    refKind: Ingress
    refApiVersion: networking.k8s.io/v1
    name: {{ .Values.name }}
  service:
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
  analysis:
    interval: {{ .Values.canary.stepInterval }}
    threshold: {{ .Values.canary.failureThreshold }}
    maxWeight: {{ .Values.canary.maxWeight }}
    stepWeight: {{ .Values.canary.stepWeight }}
    metrics:
      - name: request-success-rate
        thresholdRange:
          min: {{ .Values.canary.thresholds.successRate }}
        interval: 1m
      - name: request-duration
        thresholdRange:
          max: {{ .Values.canary.thresholds.latency }}
        interval: 1m
{{- end }}